# The IntelliJ Platform to build against, see gradle-<platformVersion>.properties.
# Use -PplatformVersion=262 to build for another version.
platformVersion=261

pluginVersion=0.1.0

# JFlex, which generates the Kotlin lexers, see tools/lexer/idea-flex-kotlin.skeleton
jflexVersion=1.10.17
# Grammar-Kit, which generates the Kotlin parsers and the Java PSI, see tools/parser/GrammarKitGenerator.java
grammarKitVersion=2023.3.4

kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
